spring.application.name=edabip-prathibha-api
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/edabip_prathibha?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# schema.sql and data.sql are applied manually; avoid rerunning CREATE TABLE on every startup.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html

# Local development fallback; override JWT_SECRET with a unique random secret in deployed environments.
app.jwt.secret=${JWT_SECRET:edabip-local-development-signing-secret-change-before-deployment}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

